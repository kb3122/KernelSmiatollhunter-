name: Universal Kernel Builder + KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: '🔗 URL kernel source'
        required: true
        default: 'https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250'
      kernel_branch:
        description: '🌿 Branch kernel source'
        required: true
        default: '16.0'
      defconfig:
        description: '🧪 Kernel defconfig'
        required: true
        default: 'vendor/xiaomi/miatoll_defconfig'
      anykernel:
        description: '📦 Use AnyKernel3 packaging?'
        required: true
        type: boolean
        default: true
      anykernel_repo:
        description: '🌐 URL AnyKernel3 repo'
        required: false
        default: 'https://github.com/osm0sis/AnyKernel3.git'
      anykernel_branch:
        description: '🌿 Branch of AnyKernel3'
        required: false
        default: 'master'
      zip_name:
        description: '📝 Output ZIP base name'
        required: false
        default: 'Miatoll-NetHunter-KSU'
      developer:
        description: '👤 Developer name/ID'
        required: false
        default: 'kb3122'
      enable_kernelsu_next:
        description: '🔘 Enable KernelSU-Next patch?'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      OUT_DIR: out

    steps:
      - name: 🧰 Setup Toolchain
        run: |
          # GCC 4.9 cross compilers
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9

          # Clang 19 (r530567) - Android 16 compatible
          mkdir clang
          curl -s "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz" -RLO
          tar -C clang/ -xf clang-*.tar.gz

      - name: ⏱️ Pull Kernel Source
        run: |
          git clone --depth=1 ${{ github.event.inputs.kernel_source }} -b ${{ github.event.inputs.kernel_branch }} kernel-source

      # ============================================================
      # Inject KernelSU-Next driver (MANUAL symlink — more reliable
      # than setup.sh on non-GKI kernels where setup.sh fails silently)
      # ============================================================
      - name: 🧙 Inject KernelSU-Next
        if: ${{ github.event.inputs.enable_kernelsu_next }}
        run: |
          cd kernel-source

          # ---- 1. Clone the KernelSU-Next driver ----
          if [ ! -d "KernelSU-Next" ]; then
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          fi
          echo "=== KernelSU-Next tree ==="
          ls -la KernelSU-Next/
          echo "=== KernelSU-Next/kernel contents ==="
          ls -la KernelSU-Next/kernel/ | head -30

          # ---- 2. Symlink the driver into drivers/kernelsu ----
          if [ -e "drivers/kernelsu" ]; then
            rm -f drivers/kernelsu
          fi
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "=== Symlink ==="
          ls -la drivers/kernelsu

          # ---- 3. Patch drivers/Kconfig to source the KSU Kconfig ----
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          echo "=== drivers/Kconfig tail ==="
          tail -5 drivers/Kconfig

          # ---- 4. Patch drivers/Makefile to build KSU ----
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          echo "=== drivers/Makefile tail ==="
          tail -5 drivers/Makefile

          # ---- 5. Sanity check: is the Kconfig symbol visible? ----
          echo "=== drivers/kernelsu/Kconfig ==="
          head -60 drivers/kernelsu/Kconfig || echo "ERROR: kernelsu Kconfig not found!"

      # ============================================================
      # Patch VFS hooks — required for KernelSU to actually activate
      # ============================================================
      - name: 🔧 Patch Kernel Source for VFS Hooks
        if: ${{ github.event.inputs.enable_kernelsu_next }}
        run: |
          cd kernel-source

          echo "=== Patching fs/exec.c ==="
          sed -i 's|^static int do_execveat_common(int fd, struct filename \*filename,|#ifdef CONFIG_KSU\n\textern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\nstatic int do_execveat_common(int fd, struct filename *filename,|' fs/exec.c

          echo "=== Patching fs/open.c ==="
          sed -i 's|^static int do_faccessat(int dfd, const char __user \*filename, int mode,|#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\nstatic int do_faccessat(int dfd, const char __user *filename, int mode,|' fs/open.c

          echo "=== Patching fs/read_write.c ==="
          sed -i 's|^ssize_t vfs_read(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)|#ifdef CONFIG_KSU\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\nssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)\n{\n#ifdef CONFIG_KSU\n\tksu_handle_vfs_read(\&file, \&buf, \&count, \&pos);\n#endif|' fs/read_write.c

          echo "=== Patching fs/stat.c ==="
          sed -i 's|^int vfs_statx(int dfd, const char __user \*filename, int flags,|#ifdef CONFIG_KSU\n\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\nint vfs_statx(int dfd, const char __user *filename, int flags,|' fs/stat.c

          echo "=== VFS hook patching complete ==="
          grep -n "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c || echo "WARNING: Some patches may not have applied"

      - name: 🧪 Inject NetHunter & KSU Manual Hook Defconfigs
        run: |
          DEFCONFIG="kernel-source/arch/arm64/configs/${{ github.event.inputs.defconfig }}"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "[!] Primary path failed, searching for defconfig..."
            DEFCONFIG=$(find kernel-source -name "$(basename ${{ github.event.inputs.defconfig }})" | head -n 1)
          fi

          if [ -f "$DEFCONFIG" ]; then
            echo "[+] Found defconfig at: $DEFCONFIG"

            # KernelSU-Next — enable the driver
            echo "CONFIG_KSU=y" >> $DEFCONFIG

            # Zygisk Next prerequisites
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
            echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $DEFCONFIG

            # NetHunter Wi-Fi drivers
            echo "CONFIG_CFG80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211_MESH=y" >> $DEFCONFIG
            echo "CONFIG_CFG80211_WEXT=y" >> $DEFCONFIG
            echo "CONFIG_WLAN_VENDOR_ATH=y" >> $DEFCONFIG
            echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> $DEFCONFIG
            echo "CONFIG_WLAN_VENDOR_RALINK=y" >> $DEFCONFIG
            echo "CONFIG_ATH9K_HTC=m" >> $DEFCONFIG
            echo "CONFIG_RTL8188EU=m" >> $DEFCONFIG
            echo "CONFIG_RTL8812AU=m" >> $DEFCONFIG
            echo "CONFIG_RTL88x2BU=m" >> $DEFCONFIG
            echo "CONFIG_RT2800USB=m" >> $DEFCONFIG
            echo "CONFIG_RT2X00=m" >> $DEFCONFIG

            # NetHunter USB Ethernet
            echo "CONFIG_USB_NET_DRIVERS=y" >> $DEFCONFIG
            echo "CONFIG_USB_USBNET=y" >> $DEFCONFIG
            echo "CONFIG_USB_NET_AX88179_178A=y" >> $DEFCONFIG
            echo "CONFIG_USB_NET_RTL8152=y" >> $DEFCONFIG
            echo "CONFIG_USB_NET_CDCETHER=y" >> $DEFCONFIG
            echo "CONFIG_USB_NET_CDC_NCM=y" >> $DEFCONFIG

            # NetHunter BadUSB / HID
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
            echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y" >> $DEFCONFIG

            # NetHunter Bluetooth
            echo "CONFIG_BT_HCIBTUSB=y" >> $DEFCONFIG
            echo "CONFIG_BT_HCIBTUSB_BCM=y" >> $DEFCONFIG
            echo "CONFIG_BT_HCIBTUSB_RTL=y" >> $DEFCONFIG

            # NetHunter SDR / DVB
            echo "CONFIG_MEDIA_SUPPORT=y" >> $DEFCONFIG
            echo "CONFIG_MEDIA_USB_SUPPORT=y" >> $DEFCONFIG
            echo "CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y" >> $DEFCONFIG
            echo "CONFIG_DVB_USB_V2=y" >> $DEFCONFIG
            echo "CONFIG_DVB_USB_RTL28XXU=y" >> $DEFCONFIG

            # IPC & Namespaces
            echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
            echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
            echo "CONFIG_USER_NS=y" >> $DEFCONFIG
            echo "CONFIG_PID_NS=y" >> $DEFCONFIG
            echo "CONFIG_UTS_NS=y" >> $DEFCONFIG
            echo "CONFIG_IPC_NS=y" >> $DEFCONFIG
            echo "CONFIG_NET_NS=y" >> $DEFCONFIG
            echo "CONFIG_BLK_DEV_LOOP=y" >> $DEFCONFIG

            echo "[+] All NetHunter + KSU configs appended."
          else
            echo "❌ ERROR: Could not locate defconfig: ${{ github.event.inputs.defconfig }}"
            exit 1
          fi

      # ============================================================
      # Build Kernel
      # ============================================================
      - name: ⚙️ Build Kernel
        run: |
          export KBUILD_BUILD_USER="${{ github.event.inputs.developer }}"
          export KBUILD_BUILD_HOST="workspace"
          export PATH=$GITHUB_WORKSPACE/clang/bin:${PATH}
          args="ARCH=arm64 \
                LLVM=1 \
                LLVM_IAS=1 \
                O=../out \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin/aarch64-linux-android- \
                CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"
          cd kernel-source

          echo "=== Generating .config from defconfig ==="
          make ${args} ${{ github.event.inputs.defconfig }}

          if [ -f ../out/.config ]; then
            CONFIG_FILE="../out/.config"
          elif [ -f out/.config ]; then
            CONFIG_FILE="out/.config"
          else
            CONFIG_FILE=$(find .. -name ".config" -not -path "*/scripts/*" | head -1)
          fi
          echo "[+] Using CONFIG_FILE=$CONFIG_FILE"

          echo "=== KSU symbols BEFORE olddefconfig ==="
          grep -E "KSU|KSU_MANUAL|KSU_WITH_KPROBES" "$CONFIG_FILE" || echo "(none found)"

          echo "=== Running olddefconfig ==="
          make ${args} olddefconfig

          echo "=== KSU symbols AFTER olddefconfig ==="
          grep -E "KSU_MANUAL|KSU_WITH_KPROBES|^CONFIG_KSU=" "$CONFIG_FILE" || echo "(none found)"

          if ! grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "$CONFIG_FILE"; then
            echo "⚠️ WARNING: CONFIG_KSU_MANUAL_HOOK=y not present"
          fi

          echo "=== Building kernel ==="
          make -j$(nproc) ${args}

      - name: 📦 Package with AnyKernel3
        if: ${{ github.event.inputs.anykernel }}
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.anykernel_branch }}" "${{ github.event.inputs.anykernel_repo }}" AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/LICENSE AnyKernel3/README.md

          base64 -d > AnyKernel3/anykernel.sh << 'AK3EOF'
          
          AK3EOF

          if [ -d "kernel-source/out/arch/arm64/boot" ]; then
            IMG_PATH="kernel-source/out/arch/arm64/boot"
          elif [ -d "out/arch/arm64/boot" ]; then
            IMG_PATH="out/arch/arm64/boot"
          else
            echo "❌ Cannot find kernel output directory"
            find . -name "Image" -o -name "Image.gz" 2>/dev/null | head -5
            exit 1
          fi
          echo "[+] Using IMG_PATH=$IMG_PATH"

          for img in Image.gz-dtb Image-dtb Image.gz Image; do
            if [[ -f $IMG_PATH/$img ]]; then
              cp $IMG_PATH/$img AnyKernel3/$img
              echo "[+] Copied $img"
              break
            fi
          done
          if [[ -f $IMG_PATH/dtbo.img ]]; then
            cp $IMG_PATH/dtbo.img AnyKernel3/dtbo.img
            echo "[+] Copied dtbo.img"
          fi

          mkdir -p AnyKernel3/tools
          curl -LSs "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.0/ksud-aarch64-linux-android" \
            -o AnyKernel3/tools/ksud
          chmod 755 AnyKernel3/tools/ksud

          DATE=$(date +'%Y-%m-%d_%H-%M')
          ZIP_NAME="${{ github.event.inputs.zip_name }}-${{ github.event.inputs.developer }}-${DATE}.zip"
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" .
          cd ..
          echo "[+] Created ${ZIP_NAME}"

      - name: ☁️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.developer }}
          path: |
            *.zip
            AnyKernel3/*.zip
            kernel-source/out/arch/arm64/boot/Image*
            kernel-source/out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
