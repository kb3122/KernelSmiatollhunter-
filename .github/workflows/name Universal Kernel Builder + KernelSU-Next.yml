name: Universal Kernel Builder + KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: '🔗 URL kernel source'
        required: true
        default: 'https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250'
      kernel_branch:
        description: '🌿 Branch kernel source'
        required: true
        default: '16.0'
      defconfig:
        description: '🧪 Kernel defconfig'
        required: true
        default: 'vendor/xiaomi/miatoll_defconfig'
      anykernel:
        description: '📦 Use AnyKernel3 packaging?'
        required: true
        type: boolean
        default: true
      anykernel_repo:
        description: '🌐 URL AnyKernel3 repo'
        required: false
        default: 'https://github.com/osm0sis/AnyKernel3.git'
      anykernel_branch:
        description: '🌿 Branch of AnyKernel3'
        required: false
        default: 'master'
      zip_name:
        description: '📝 Output ZIP base name'
        required: false
        default: 'Miatoll-NetHunter-KSU'
      developer:
        description: '👤 Developer name/ID'
        required: false
        default: 'kb3122'
      enable_kernelsu_next:
        description: '🔘 Enable KernelSU-Next patch?'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      OUT_DIR: out

    steps:
      - name: 🧰 Setup Toolchain
        run: |
          # GCC 4.9 Cross Compilers
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
          
          # Clang 19 (r530567) for Android 16 compatibility
          mkdir clang
          curl -s "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz" -RLO
          tar -C clang/ -xf clang-*.tar.gz

      - name: ⏱️ Pull Kernel Source
        run: |
          git clone --depth=1 ${{ github.event.inputs.kernel_source }} -b ${{ github.event.inputs.kernel_branch }} kernel-source

      # ============================================================
      # FIXED: use official KernelSU-Next setup.sh (next branch)
      # The legacy "init_kernelsu.sh" does NOT exist in KernelSU-Next
      # ============================================================
      - name: 🧙 Inject KernelSU-Next
        if: ${{ github.event.inputs.enable_kernelsu_next }}
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "=== KernelSU-Next tree after setup ==="
          ls -la KernelSU-Next/ 2>/dev/null || ls -la KernelSU/ 2>/dev/null || true

      - name: 🧪 Inject NetHunter & KSU Manual Hook Defconfigs
        run: |
          # Locate the defconfig file inside the kernel source
          DEFCONFIG="kernel-source/arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          
          # Fallback if the defconfig is in a different subfolder
          if [ ! -f "$DEFCONFIG" ]; then
            echo "Primary path failed, searching for ${{ github.event.inputs.defconfig }}..."
            DEFCONFIG=$(find kernel-source -name "$(basename ${{ github.event.inputs.defconfig }})" | head -n 1)
          fi
          if [ -f "$DEFCONFIG" ]; then
            echo "Appending configs to $DEFCONFIG"
            
            # 1. KernelSU-Next Manual Hook (Required for Zygisk Next on non-GKI)
            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
            echo "# CONFIG_KSU_WITH_KPROBES is not set" >> $DEFCONFIG
            echo "# CONFIG_KSU_SUSFS_SUS_SU is not set" >> $DEFCONFIG
            
            # 2. Zygisk Next Prerequisites
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
            echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $DEFCONFIG
            
            # 3. NetHunter Core Drivers (Wi-Fi, HID, Bluetooth, SDR)
            echo "CONFIG_CFG80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211=y" >> $DEFCONFIG
            echo "CONFIG_ATH9K_HTC=m" >> $DEFCONFIG
            echo "CONFIG_RTL8188EU=m" >> $DEFCONFIG
            echo "CONFIG_RTL8812AU=m" >> $DEFCONFIG
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
            echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
            echo "CONFIG_BT_HCIBTUSB=y" >> $DEFCONFIG
            echo "CONFIG_DVB_USB_RTL28XXU=y" >> $DEFCONFIG
            
            # 4. IPC & Namespaces (chroot, Metasploit, Docker)
            echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
            echo "CONFIG_USER_NS=y" >> $DEFCONFIG
            echo "CONFIG_BLK_DEV_LOOP=y" >> $DEFCONFIG
            
            echo "Configs appended successfully."
          else
            echo "❌ ERROR: Could not locate defconfig: ${{ github.event.inputs.defconfig }}"
            exit 1
          fi

      - name: ⚙️ Build Kernel
        run: |
          export KBUILD_BUILD_USER="${{ github.event.inputs.developer }}"
          export KBUILD_BUILD_HOST="workspace"
          export PATH=$GITHUB_WORKSPACE/clang/bin:${PATH}
          args="ARCH=arm64 \
                LLVM=1 \
                LLVM_IAS=1 \
                O=../out \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin/aarch64-linux-android- \
                CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"
          cd kernel-source
          make ${args} ${{ github.event.inputs.defconfig }}
          make -j$(nproc) ${args}

      - name: 📦 Package with AnyKernel3
        if: ${{ github.event.inputs.anykernel }}
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.anykernel_branch }}" "${{ github.event.inputs.anykernel_repo }}" AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/LICENSE AnyKernel3/README.md
          IMG_PATH="out/arch/arm64/boot"
          for img in Image.gz-dtb Image-dtb Image.gz Image; do
            if [[ -f $IMG_PATH/$img ]]; then
              cp $IMG_PATH/$img AnyKernel3/$img
              break
            fi
          done
          if [[ -f $IMG_PATH/dtbo.img ]]; then
            cp $IMG_PATH/dtbo.img AnyKernel3/dtbo.img
          fi
          # Download ksud v3.4.0 (matches KernelSU-Next Manager)
          mkdir -p AnyKernel3/tools
          curl -LSs "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.0/ksud-aarch64-linux-android" -o AnyKernel3/tools/ksud
          chmod 755 AnyKernel3/tools/ksud
          DATE=$(date +'%Y-%m-%d_%H-%M')
          ZIP_NAME="${{ github.event.inputs.zip_name }}-${{ github.event.inputs.developer }}-${DATE}.zip"
          cd AnyKernel3
          zip -r "${ZIP_NAME}" *

      - name: ☁️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.developer }}
          path: |
            AnyKernel3/*.zip
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
